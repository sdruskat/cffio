name: validate-examples
on:
  push:
    branches:
      - main
      - develop
permissions:
  contents: read

jobs:
  publish-docs-with-uv:
    env:
      # Configure a constant location for the uv cache
      UV_CACHE_DIR: /tmp/.uv-cache-validate-examples

    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache-validate-examples
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Validate example files
        run: |
            files=$(find ./docs/_assets/ -type f -name 'cff-*-example.md')
            for file in $files; do
            cat $file | head -n -1 | tail -n +2 > $file.cff
            echo "Validating $file.cff"
            uvx cffconvert --validate -i $file.cff || exit 1
            done
            cfffiles=$(find ./docs/_assets/ -type f -name 'cff-*-example.md.cff')
            for cfffile in $cfffiles; do
            rm $cfffile
            done
            echo "Done."

      - name: Minimize uv cache
        run: uv cache prune --ci
